name: 실거래가 수집

on:
  schedule:
    # 매일 06:10 KST (UTC 21:10 전날)
    - cron: '10 21 * * *'
  workflow_dispatch:
    inputs:
      months:
        description: '수집 개월 수'
        default: '12'
      only:
        description: '특정 시군구만 (쉼표 구분, 비우면 전체)'
        default: ''

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 수집
        env:
          MOLIT_SERVICE_KEY: ${{ secrets.MOLIT_SERVICE_KEY }}
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          MONTHS: ${{ github.event.inputs.months || '12' }}
          ONLY: ${{ github.event.inputs.only || '' }}
        run: node scripts/collect.mjs

      - name: 커밋
        run: |
          git config user.name "hd-dhp-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs scripts/geo-cache.json
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "데이터 갱신 $(date -u +%Y-%m-%d)"
            git push
          fi
